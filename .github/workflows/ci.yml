name: CI

# CI chỉ build/test — không upload, không phát hành → token read-only là đủ
permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  # PR mới push vào thì cancel run cũ của cùng PR — tiết kiệm runner;
  # master giữ run cuối (group per-ref, cancel-in-progress chỉ trên PR)
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: ReTran.App/ReTran.App.csproj
  TEST_PROJECT: ReTran.Tests/ReTran.Tests.csproj

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui

      # Build app windows-TFM để bắt lỗi Razor/MAUI trước khi chạy test
      - name: Build app (Windows)
        run: dotnet build "${{ env.PROJECT_PATH }}" -f net10.0-windows10.0.19041.0 --nologo

      # xUnit v3 là executable self-hosted. Chạy trực tiếp runner để tránh lỗi
      # MTP handshake đã làm CI treo trước discovery với "Zero tests ran".
      - name: Build test project
        run: dotnet build "${{ env.TEST_PROJECT }}" --nologo

      - name: Test
        timeout-minutes: 5
        shell: pwsh
        run: |
          & "ReTran.Tests/bin/Debug/net10.0-windows10.0.19041.0/ReTran.Tests.exe" -noLogo -noColor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
