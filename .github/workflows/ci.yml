name: CI

# CI chỉ build/test — không upload, không phát hành → token read-only là đủ
permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  # PR mới push vào thì cancel run cũ của cùng PR — tiết kiệm runner;
  # master giữ run cuối (group per-ref, cancel-in-progress chỉ trên PR)
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: ReTran.App/ReTran.App.csproj
  TEST_PROJECT: ReTran.Tests/ReTran.Tests.csproj

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui

      # Build app windows-TFM để bắt lỗi Razor/MAUI trước khi chạy test
      - name: Build app (Windows)
        run: dotnet build "${{ env.PROJECT_PATH }}" -f net10.0-windows10.0.19041.0 --nologo

      # xUnit v3 là executable self-hosted. Chạy qua dotnet host để tránh lỗi
      # startup/handshake của apphost đã làm CI treo trước discovery.
      - name: Build test project
        run: dotnet build "${{ env.TEST_PROJECT }}" --nologo

      - name: Build minimal xUnit probe
        timeout-minutes: 5
        shell: pwsh
        run: |
          $probeDir = Join-Path $env:RUNNER_TEMP "retran-xunit-probe"
          New-Item -ItemType Directory -Path $probeDir -Force | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <OutputType>Exe</OutputType>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup><PackageReference Include="xunit.v3" Version="4.0.2" /></ItemGroup>
          </Project>
          '@ | Set-Content -Encoding utf8 (Join-Path $probeDir "Probe.csproj")
          'using Xunit; public class ProbeTests { [Fact] public void Pass() { } }' |
            Set-Content -Encoding utf8 (Join-Path $probeDir "ProbeTests.cs")
          dotnet build (Join-Path $probeDir "Probe.csproj") --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diagnose test process startup
        timeout-minutes: 4
        shell: pwsh
        run: |
          $script:allSucceeded = $true
          function Invoke-BoundedProcess {
            param([string]$Name, [string]$FileName, [string[]]$Arguments)
            $stdout = Join-Path $env:RUNNER_TEMP "$Name.stdout.log"
            $stderr = Join-Path $env:RUNNER_TEMP "$Name.stderr.log"
            Write-Host "=== $Name START ==="
            try {
              $process = Start-Process -FilePath $FileName -ArgumentList $Arguments `
                -RedirectStandardOutput $stdout -RedirectStandardError $stderr -NoNewWindow -PassThru
              if (-not $process.WaitForExit(30000)) {
                Write-Host "$Name TIMEOUT AFTER 30s"
                $script:allSucceeded = $false
                try { $process.Kill($true) } catch { }
                $process.WaitForExit()
              } else {
                Write-Host "$Name EXIT=$($process.ExitCode)"
                if ($process.ExitCode -ne 0) { $script:allSucceeded = $false }
              }
            } catch {
              Write-Host "$Name START ERROR: $($_.Exception.Message)"
              $script:allSucceeded = $false
            }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
          }

          Invoke-BoundedProcess "core-version" "dotnet" `
            @("ReTran.Core/bin/Debug/net10.0-windows/ReTran.Core.dll", "version")
          Invoke-BoundedProcess "minimal-xunit" "dotnet" `
            @((Join-Path $env:RUNNER_TEMP "retran-xunit-probe/bin/Debug/net10.0/Probe.dll"), "-assemblyInfo")
          Invoke-BoundedProcess "tests-dotnet-host" "dotnet" `
            @("ReTran.Tests/bin/Debug/net10.0-windows10.0.19041.0/ReTran.Tests.dll", "-assemblyInfo")
          Invoke-BoundedProcess "tests-apphost" (Resolve-Path `
            "ReTran.Tests/bin/Debug/net10.0-windows10.0.19041.0/ReTran.Tests.exe").Path @("-assemblyInfo")
          if (-not $script:allSucceeded) { exit 1 }
