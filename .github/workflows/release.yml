name: Build Release

# Least privilege mặc định — job build-windows nâng cấp mức cần thiết riêng
permissions:
  contents: read

on:
  release:
    types: [ published ]
  workflow_dispatch:

# release.published và workflow_dispatch trên tag có thể chạy trùng — không cancel
# release đang chạy dở (cancel giữa chừng để state nửa vời trên GitHub)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: ReTran.App/ReTran.App.csproj
  OUTPUT_DIR: publish
  # Job-level để if của bước Sign đọc được (step-level env không có trong if) —
  # true khi khai Azure Key Vault secrets, false → bỏ qua signing
  HAS_AZURE_SECRETS: ${{ secrets.AZURE_KEY_VAULT_URI != '' }}

jobs:
  build-windows:
    runs-on: windows-latest
    # Environment 'release': UPDATE_SIGNING_KEY và Azure secrets nên đặt làm
    # environment secrets (Settings → Environments → release), KHÔNG phải repository
    # secrets — chỉ unlock khi job này chạy; thêm required reviewers để gate tay.
    environment: release
    permissions:
      contents: write     # gh release upload
      id-token: write     # OIDC (azure/login) + attest-build-provenance
      attestations: write # attest-build-provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # Fail before setup unless assembly/display versions and the release tag agree.
      # Fail ngay trước setup nếu version assembly/display và tag release không khớp.
      - name: Verify release versions
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content "${{ env.PROJECT_PATH }}"
          $version = [string]($csproj.Project.PropertyGroup.Version | Select-Object -First 1)
          $display = [string]($csproj.Project.PropertyGroup.ApplicationDisplayVersion | Select-Object -First 1)
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Version '$version' must contain exactly four numeric components."
          }
          $versionDisplay = ($version.Split('.') | Select-Object -First 3) -join '.'
          if ($display -cne $versionDisplay) {
            throw "Version '$version' has display prefix '$versionDisplay', but ApplicationDisplayVersion is '$display'."
          }
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.ref_name }}".TrimStart('v')
            if ($display -cne $tag) {
              throw "Tag '${{ github.ref_name }}' does not match ApplicationDisplayVersion '$display' after TrimStart('v') — bump the csproj before tagging."
            }
          }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      # Updater exe tự vào output khi publish qua ProjectReference
      # OutputItemType=Content trong ReTran.App.csproj — không cần build/copy riêng
      - name: Publish ReTran.App (Windows)
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" `
            -f net10.0-windows10.0.19041.0 `
            -r win-x64 `
            -c Release `
            --self-contained `
            -o ${{ env.OUTPUT_DIR }}

      # Merge only Core-owned files, preserve App dependency hashes, then run the publish gate.
      # Chỉ gộp file thuộc Core, giữ nguyên hash dependency App, rồi chạy publish gate.
      - name: Publish ReTran.Core + verify package
        shell: pwsh
        run: |
          dotnet publish "ReTran.Core/ReTran.Core.csproj" -c Release -r win-x64 --self-contained -o publish-core
          $smokeArguments = @{
            OutputDir = "${{ env.OUTPUT_DIR }}"
            CorePublishDir = "publish-core"
            ProjectPath = "${{ env.PROJECT_PATH }}"
          }
          if ("${{ github.event_name }}" -eq "release") {
            $smokeArguments.ExpectedTag = "${{ github.ref_name }}"
          }
          & "Tools/Release/Test-ReleasePackage.ps1" @smokeArguments
          Remove-Item -Recurse -Force publish-core

      # OIDC (workload identity federation) thay client secret lâu dài —
      # cần federated credential trên Entra app trỏ repo + environment 'release'
      - name: Azure login (OIDC)
        if: env.HAS_AZURE_SECRETS == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Ký luôn uv.exe — wizard first-run chạy binary lạ lần đầu, không ký sẽ bị SmartScreen chặn
      - name: Sign binaries (optional)
        if: env.HAS_AZURE_SECRETS == 'true'
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
        shell: pwsh
        run: |
          Write-Host "Signing with Azure Code Signing (OIDC access token)..."
          dotnet tool install --global AzureSignTool --version 6.0.1
          $token = az account get-access-token `
            --resource https://vault.azure.net --query accessToken -o tsv
          AzureSignTool sign `
            -kvu "$env:AZURE_KEY_VAULT_URI" `
            -kva "$token" `
            -kvc "$env:AZURE_CERT_NAME" `
            -tr "http://timestamp.digicert.com" `
            -v "${{ env.OUTPUT_DIR }}/ReTran.App.exe" `
            "${{ env.OUTPUT_DIR }}/ReTran.Updater.exe" `
            "${{ env.OUTPUT_DIR }}/runtimes/win-x64/uv.exe"

      - name: Package zip
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "release") {
            "${{ github.ref_name }}"
          } else {
            "$(Get-Date -Format 'yyyyMMdd.HHmm')"
          }
          Compress-Archive -Path ${{ env.OUTPUT_DIR }}/* -DestinationPath "ReTran-$version-win-x64.zip"

      # Ký zip bằng ECDSA P-256 (UPDATE_SIGNING_KEY = PKCS#8 Base64, environment secret).
      # Client verify bằng PackageSignatureVerifier.ReleasePublicKeyBase64 trước khi cài
      # (fail-closed: release không có .sig → client từ chối update). Bắt buộc có key —
      # thiếu secret phải fail ngay, không upload zip không ký.
      - name: Sign zip (ECDSA P-256)
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_KEY)) {
            throw "UPDATE_SIGNING_KEY secret is missing — every release zip must be signed (fail-closed)."
          }
          $zip = Get-Item "ReTran-*.zip" | Select-Object -First 1
          $ecdsa = [System.Security.Cryptography.ECDsa]::Create()
          try {
            $read = 0
            $ecdsa.ImportPkcs8PrivateKey(
              [Convert]::FromBase64String($env:UPDATE_SIGNING_KEY), [ref]$read)
            $hash = [System.Security.Cryptography.SHA256]::HashData(
              [IO.File]::ReadAllBytes($zip.FullName))
            # SignHash mặc định xuất IEEE P1363 (r||s) — trùng format client VerifyHash
            $signature = $ecdsa.SignHash($hash)
            [IO.File]::WriteAllText(
              "$($zip.FullName).sig", [Convert]::ToBase64String($signature))
            Write-Host "Signed $($zip.Name) → $($zip.Name).sig"
          }
          finally {
            $ecdsa.Dispose()
          }

      # SHA256SUMS.txt cho người tải tự verify thủ công — client không dùng (verify qua .sig)
      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          Get-ChildItem "ReTran-*" |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # Provenance attestation — ai cũng verify được zip sinh từ workflow nào, commit nào
      # (gh attestation verify). Giảm risk CI supply chain & tamper GitHub release.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            ReTran-*

      # Chỉ upload khi trigger bởi release published — workflow_dispatch chạy trên branch
      # nên ref_name không phải tag release, gh release upload sẽ fail
      - name: Upload Release Asset
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            ReTran-*.zip ReTran-*.zip.sig SHA256SUMS.txt `
            --clobber
